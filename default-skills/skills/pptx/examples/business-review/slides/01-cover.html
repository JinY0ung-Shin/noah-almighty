<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>01 표지 · 2026년 3분기 사업 실적 보고</title>
<link rel="stylesheet" href="../theme/base.css">
<link rel="stylesheet" href="../theme/fonts.css">
<style>
  main.slide.cover {
    background: linear-gradient(135deg, #0A1433 0%, #1B3796 100%);
    color: var(--c-white);
  }

  /* ---- decorative composition: shapes only (circles + pill-shaped bars), all inside the slide ---- */
  .deco { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .deco > div { position: absolute; }
  .ring  { left: 616px; top: 40px; width: 640px; height: 640px; border-radius: 50%;
           border: 1px solid rgba(255, 255, 255, 0.10); }
  .halo  { left: 676px; top: 100px; width: 520px; height: 520px; border-radius: 50%;
           background: rgba(74, 110, 242, 0.20); }
  .bar   { width: 72px; border-radius: 36px; }
  /* 2026 quarterly revenue from zero on one scale (1,148 / 1,209 / 1,284 / 1,410 억 원 -> 368 px = 1,410):
     the motif never exaggerates the growth; 3Q = the reported quarter (accent), 4Q = the forecast, drawn as the
     chart draws it: a lighter brand-blue fill (one forecast encoding across the deck) */
  .bar-1 { left: 756px;  top: 276px; height: 300px; background: rgba(255, 255, 255, 0.12); }
  .bar-2 { left: 852px;  top: 260px; height: 316px; background: rgba(255, 255, 255, 0.18); }
  .bar-3 { left: 948px;  top: 241px; height: 335px; background: linear-gradient(180deg, #FFB27D 0%, #FF7A3D 100%); }
  .bar-4 { left: 1044px; top: 208px; height: 368px; background: rgba(111, 143, 240, 0.55); }
  .orbit-a { left: 1171px; top: 144px; width: 20px; height: 20px; border-radius: 50%; background: rgba(255, 255, 255, 0.90); }
  .orbit-b { left: 629px;  top: 245px; width: 12px; height: 12px; border-radius: 50%; background: rgba(163, 182, 250, 0.80); }
  .baseline { left: 732px; top: 576px; width: 408px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.16); }

  /* ---- text column ---- */
  .brand { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 8px; }
  .brand .mark-a { background: var(--c-white); }
  .wordmark { font-size: 18px; line-height: 24px; font-weight: 800; letter-spacing: -0.01em; color: var(--c-white); }

  .cover-pill { position: absolute; left: 80px; top: 208px; padding: 6px 16px;
                font-size: 13px; line-height: 20px; letter-spacing: var(--tracking-label); }
  /* The title and subtitle boxes end 16 px or more before the ring (x 616 at its leftmost): a title line longer than
     520 px wraps, which the check reports (title-wrap) — shorten it or re-split it with <br>, never let it run into
     the motif. About 8 Hangul syllables fit per 60 px line in the malgun profile. */
  .cover-title { position: absolute; left: 80px; top: 264px; width: 520px;
                 font-size: var(--fs-display); line-height: var(--lh-display); font-weight: 800;
                 letter-spacing: var(--tracking-display); color: var(--c-white); }
  .cover-subtitle { position: absolute; left: 80px; top: 448px; width: 536px;
                    font-size: var(--fs-lead); line-height: var(--lh-lead); color: rgba(255, 255, 255, 0.76); }

  .meta { position: absolute; left: 80px; top: 536px; width: 536px; padding-top: 24px;
          border-top: 1px solid rgba(255, 255, 255, 0.16);
          display: grid; grid-template-columns: repeat(3, 176px); }   /* fixed pitch: identical in both profiles */
  .meta-label { font-size: 13px; line-height: 20px; font-weight: 600; letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.56); }
  .meta-value { margin-top: 4px; font-size: 17px; line-height: 24px; font-weight: 600; color: var(--c-white); }

  .cover-note { position: absolute; left: 80px; top: 680px; font-size: var(--fs-micro); line-height: var(--lh-micro);
                color: rgba(255, 255, 255, 0.60); }
</style>
</head>
<body>
<main class="slide cover" data-layout="표지">
  <div class="deco" data-group="장식">
    <div class="ring"></div>
    <div class="halo"></div>
    <div class="baseline"></div>
    <div class="bar bar-1"></div>
    <div class="bar bar-2"></div>
    <div class="bar bar-3"></div>
    <div class="bar bar-4"></div>
    <div class="orbit-a"></div>
    <div class="orbit-b"></div>
  </div>

  <div class="brand" data-group="브랜드">
    <div class="mark" data-group="브랜드 마크"><div class="mark-a"></div><div class="mark-b"></div></div>
    <p class="wordmark">예시테크</p>
  </div>

  <p class="pill pill--glass cover-pill">대외비</p>
  <h1 class="cover-title" data-placeholder="ctrTitle">2026년 3분기<br>사업 실적 보고</h1>
  <p class="cover-subtitle" data-placeholder="subTitle">분기 최대 매출과 수익성 개선을 동시에 달성</p>

  <div class="meta">
    <div class="meta-item"><p class="meta-label">발표 부서</p><p class="meta-value">경영전략실</p></div>
    <div class="meta-item"><p class="meta-label">발표일</p><p class="meta-value">2026년 10월 14일</p></div>
    <div class="meta-item"><p class="meta-label">보고 대상</p><p class="meta-value">경영위원회</p></div>
  </div>

  <p class="cover-note">샘플 데이터 · 본 자료의 기업명과 수치는 모두 가상으로 구성한 예시입니다</p>
</main>
</body>
</html>
