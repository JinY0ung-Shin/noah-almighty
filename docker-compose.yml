services:
  noah-almighty:
    build:
      context: .
      # Map syntax (NAME: value) throughout — compose forbids mixing the
      # `- NAME` list form with `NAME: value` entries in one args block.
      args:
        # Corporate mirror settings (empty = use upstream defaults).
        # Set these in your shell before building when your network requires a mirror.
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        # The pptx skill's HTML→editable-PPTX converter
        # (docs/architecture/pptx-converter.md). DECK_CONVERTER=0 builds a
        # legacy image without Chromium (python-pptx only) — for an apt mirror
        # that cannot serve chromium-headless-shell. DECK_CONVERTER_STRICT_GOLDEN=1
        # makes golden drift in the build-time converter self-test FAIL the
        # build instead of being recorded and reported at runtime.
        DECK_CONVERTER: ${DECK_CONVERTER:-1}
        DECK_CONVERTER_STRICT_GOLDEN: ${DECK_CONVERTER_STRICT_GOLDEN:-0}
        # Corporate proxy CA to trust for HTTPS clones (path within the build
        # context). Override in your shell: export CA_CERT_FILE=docker/tls-fullchain.crt
        CA_CERT_FILE: ${CA_CERT_FILE:-docker/extra-ca.crt.example}
        # Docker built-in proxy args – inherited from the host shell. Unset
        # ones resolve to "" and are simply not forwarded.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    ports:
      - "${PORT:-48787}:${PORT:-48787}"
    # The whole .env is injected into the container, so every ANTHROPIC_* var
    # (ANTHROPIC_API_KEY/MODEL/BASE_URL/AUTH_TOKEN, the per-tier
    # ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL, and any added later) reaches
    # the Claude Agent SDK without enumerating each key here. SESSION_SECRET,
    # AGENT_RUNTIME, READONLY_TOOLS, GITHUB_HOST come from .env too. If
    # SESSION_SECRET is missing the server throws on boot (NODE_ENV=production).
    env_file:
      - .env
    environment:
      # Force the container's data volume regardless of the .env value
      # (environment wins over env_file).
      APP_DATA_DIR: /app/data
    volumes:
      - noah-almighty-data:/app/data
      # HTTPS certs (optional): on the deploy host drop PEMs into ./docker/tls
      # and set TLS_CERT_FILE/TLS_KEY_FILE to /app/tls/<file> in .env. Read-only;
      # stays empty on plain-HTTP deployments.
      - ./docker/tls:/app/tls:ro
    restart: unless-stopped
    # PID-1 reaping backstop: tini reaps zombie child processes so the app's
    # graceful-shutdown handlers receive signals reliably even when the node
    # process spawns child processes (SDK subprocess, git, gh, etc.).
    init: true

  # Self-hosted speech-to-text for the composer's mic button. OPT-IN: the
  # `stt` profile means plain `docker compose up` / `build` / `down` ignore this
  # service entirely, so every existing deployment is unaffected until an
  # operator explicitly runs `docker compose --profile stt up -d`. The app side
  # is opt-in the same way — with STT_URL unset the mic button is not rendered.
  stt:
    profiles: ["stt"]
    # DERIVED image, not the official one: vllm/vllm-openai ships without the
    # [audio] extra (soundfile, PyAV), which the transcription endpoint needs at
    # request time — docker/stt.Dockerfile pins the base tag and adds exactly
    # that extra. Bump DELIBERATELY, never to a moving tag: the base pin lives
    # in the Dockerfile, the derived tag here — change them in one commit and
    # re-run the deploy-time transcription check in README.md.
    # The deploy host has no internet: BUILD this image on a machine that has
    # some (`docker compose --profile stt build stt`), then `docker save`/
    # `docker load` it there — load keeps this name, so this file needs no
    # edit. Or swap the reference for the corporate-registry path you pushed to.
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
      args:
        # Same corporate-mirror/proxy/CA passthrough as the app service above.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        CA_CERT_FILE: ${CA_CERT_FILE:-docker/extra-ca.crt.example}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: noah-almighty-stt:v0.27.1-audio
    # NO host ports on purpose. The transcription endpoint takes raw audio and
    # has no auth of its own, so it must stay on the compose network only —
    # Noah reaches it as http://stt:8000 (STT_URL=http://stt:8000/v1) and
    # nothing outside the host's docker network can reach it at all. Do not add
    # a `ports:` mapping to "test it"; use `docker compose exec` (see README).
    volumes:
      # Weights are brought in by hand (no Hugging Face access on the deploy
      # host): unpack them to ./docker/stt-models/Qwen3-ASR-1.7B. Read-only —
      # vLLM only ever loads from here.
      - ./docker/stt-models:/models:ro
    # The image's entrypoint already launches vLLM's OpenAI-compatible server,
    # so this is just its flags (they are also valid under the `vllm serve`
    # entrypoint some tags use). --served-model-name is what STT_MODEL must
    # match; the local path stays an implementation detail of this file.
    # The three memory flags are TUNABLE — they are sized for a shared 8–12GB
    # card, not for throughput. Raise them if the GPU is dedicated to STT.
    command:
      - --model
      - /models/Qwen3-ASR-1.7B
      - --served-model-name
      - Qwen/Qwen3-ASR-1.7B
      # Leaves ~30% of VRAM for whatever else shares the card. vLLM claims this
      # fraction of the WHOLE device up front, including memory another process
      # already holds, so it must be lowered further on a busy GPU.
      - --gpu-memory-utilization
      - "0.7"
      # Mic input is one short utterance at a time; a small batch keeps the KV
      # cache tiny. Requests past this queue rather than fail.
      - --max-num-seqs
      - "4"
      # Must cover audio tokens + transcript for the longest recording; 4096 is
      # sized for the composer's 60s hard stop on recording length. If that cap
      # is ever raised, raise this WITH it — longer clips otherwise fail here,
      # and the user only sees a generic error. Costs VRAM (more KV cache).
      - --max-model-len
      - "4096"
      # If the tag you pinned needs an explicit task selector to expose ASR
      # models on /v1/audio/transcriptions, add it here (see the deploy-time
      # check in README.md).
    environment:
      # Closed network: fail fast instead of hanging on a hub lookup if some
      # tokenizer/config path is not fully local, and don't attempt telemetry.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    # Deliberately no `env_file: .env` — this container needs none of the app's
    # config, and inheriting HTTP_PROXY/HTTPS_PROXY would route its own loopback
    # traffic through the corporate proxy.
    #
    # GPU reservation (compose reads this outside swarm too). Without it the
    # container gets no device and vLLM aborts with "no CUDA GPUs available".
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    # PyTorch shares tensors between its worker processes over /dev/shm, and
    # Docker's 64MB default is too small for that.
    shm_size: "1gb"
    healthcheck:
      # vLLM's own readiness endpoint. Driven with python (always present in
      # this image) rather than curl/wget, which are not guaranteed to be.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Weight loading + CUDA graph capture takes minutes on a shared card;
      # until then failures don't count against `retries`.
      start_period: 300s
    restart: unless-stopped
    init: true

volumes:
  noah-almighty-data:
