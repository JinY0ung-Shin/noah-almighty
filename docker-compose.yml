services:
  noah-almighty:
    build:
      context: .
      # Map syntax (NAME: value) throughout — compose forbids mixing the
      # `- NAME` list form with `NAME: value` entries in one args block.
      args:
        # Corporate mirror settings (empty = use upstream defaults).
        # Set these in your shell before building when your network requires a mirror.
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        # The pptx skill's HTML→editable-PPTX converter
        # (docs/architecture/pptx-converter.md). DECK_CONVERTER=0 builds a
        # legacy image without Chromium (python-pptx only) — for an apt mirror
        # that cannot serve chromium-headless-shell. DECK_CONVERTER_STRICT_GOLDEN=1
        # makes golden drift in the build-time converter self-test FAIL the
        # build instead of being recorded and reported at runtime.
        DECK_CONVERTER: ${DECK_CONVERTER:-1}
        DECK_CONVERTER_STRICT_GOLDEN: ${DECK_CONVERTER_STRICT_GOLDEN:-0}
        # Corporate proxy CA to trust for HTTPS clones (path within the build
        # context). Override in your shell: export CA_CERT_FILE=docker/tls-fullchain.crt
        CA_CERT_FILE: ${CA_CERT_FILE:-docker/extra-ca.crt.example}
        # Docker built-in proxy args – inherited from the host shell. Unset
        # ones resolve to "" and are simply not forwarded.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    ports:
      - "${PORT:-48787}:${PORT:-48787}"
    # The whole .env is injected into the container, so every ANTHROPIC_* var
    # (ANTHROPIC_API_KEY/MODEL/BASE_URL/AUTH_TOKEN, the per-tier
    # ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL, and any added later) reaches
    # the Claude Agent SDK without enumerating each key here. SESSION_SECRET,
    # AGENT_RUNTIME, READONLY_TOOLS, GITHUB_HOST come from .env too. If
    # SESSION_SECRET is missing the server throws on boot (NODE_ENV=production).
    env_file:
      - .env
    environment:
      # Force the container's data volume regardless of the .env value
      # (environment wins over env_file).
      APP_DATA_DIR: /app/data
    volumes:
      - noah-almighty-data:/app/data
      # HTTPS certs (optional): on the deploy host drop PEMs into ./docker/tls
      # and set TLS_CERT_FILE/TLS_KEY_FILE to /app/tls/<file> in .env. Read-only;
      # stays empty on plain-HTTP deployments.
      - ./docker/tls:/app/tls:ro
    restart: unless-stopped
    # PID 1 is the image's own EXECUTE-ONLY tini (Dockerfile ENTRYPOINT): it
    # reaps zombie child processes (SDK subprocess, git, gh, …) and forwards
    # signals to the graceful-shutdown handlers. Compose `init: true` must stay
    # OFF here: Docker's docker-init would become PID 1 as the `node` uid with a
    # readable binary, exposing the container environment (SESSION_SECRET) to
    # the agent's Bash via /proc/1/environ (#71).
    init: false

volumes:
  noah-almighty-data:
