<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Noah Almighty pi sandbox: the same registration as docker/fontconfig/60-noah-deck-fonts.conf, pointed
     at the copy docker/pi-sandbox/Dockerfile bakes into /usr/local/share/fonts/noah-deck (the sandbox has
     no /app tree, and the skill itself arrives at runtime). NotoSansKR-VF is not copied there, which is
     what the main conf's rejectfont achieves. 맑은 고딕 / Malgun Gothic resolve to Selawik (Latin, Segoe UI
     metrics) and then Gothic A1 (Hangul), the converter's metric-matched stand-ins. -->
<fontconfig>
  <dir>/usr/local/share/fonts/noah-deck</dir>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>Selawik</family><family>Gothic A1</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Selawik</family><family>Gothic A1</family></prefer></alias>
</fontconfig>
