# Noah's overrides of the INCLUDED pi-gateway compose file (docker-compose.yml `include:`). pi-gateway's
# code and compose file stay untouched; this is instance configuration, merged onto pi's file the way a
# docker-compose.override.yml would be. Relative paths here would resolve against the pi-gateway checkout,
# so there are none. Variables come from Noah's .env / the shell first, then pi-gateway's own .env.

# pi's Node services (gateway, sandboxd, mcp-broker) build FROM ${NODE_IMAGE}; hand them Noah's
# CA-trusting Node base (the `pi-node-builder` service in docker-compose.yml, docker/pi/node-ca.Dockerfile)
# so `npm ci` verifies an HTTPS npm mirror behind CA_CERT_FILE (#77). Merged onto pi's own build args.
x-pi-node-builder: &pi-node-builder
  args:
    NODE_IMAGE: pi-node-builder
  additional_contexts:
    pi-node-builder: service:pi-node-builder

services:
  # Every user sandbox runs Noah's deck-capable image (docker/pi-sandbox, built FROM pi's own sandbox
  # image by the `pi-sandbox-image` service). pi's `pi-gateway/sandbox:latest` stays pi's own build.
  sandboxd:
    environment:
      SANDBOX_IMAGE: noah-almighty/pi-sandbox:${NOAH_PI_SANDBOX_TAG:-latest}
    depends_on:
      pi-sandbox-image:
        condition: service_completed_successfully
    build: *pi-node-builder

  # pi unloads a session after SESSION_IDLE_SECONDS without a turn and rebuilds it on the next one,
  # re-listing every Noah MCP server through the broker — the step that saturates gateway and broker
  # when many sessions start at once (README "Sizing pi-gateway"). pi's own default (300) makes every
  # 5-minute pause a session start; 30 minutes covers the pauses inside a conversation. Its own name, so
  # the SESSION_IDLE_SECONDS=300 in a copied pi .env.example does not silently win.
  gateway:
    environment:
      SESSION_IDLE_SECONDS: ${NOAH_PI_SESSION_IDLE_SECONDS:-1800}
    build: *pi-node-builder

  # The broker calls Noah's /mcp/<server> over a network only it and Noah are on, from a PINNED address:
  # Noah's NOAH_MCP_ALLOWED_CIDRS defaults to exactly that address (/32), so neither the network's
  # gateway address (where published-port traffic can appear to come from) nor any other pi service
  # passes Noah's /mcp source check.
  mcp-broker:
    networks:
      noah-mcp:
        ipv4_address: ${NOAH_MCP_BROKER_IP:-172.16.248.10}
    build: *pi-node-builder

  # pi builds egress-proxy FROM ${GO_IMAGE}; hand it Noah's CA-trusting Go builder (the `pi-go-builder`
  # service in docker-compose.yml, docker/pi/golang-ca.Dockerfile) so `go mod download` trusts
  # CA_CERT_FILE behind an HTTPS GOPROXY. Merged onto pi's own build args (its mirror args stay).
  egress-proxy:
    build:
      args:
        GO_IMAGE: pi-go-builder
      additional_contexts:
        pi-go-builder: service:pi-go-builder

  # pi's trace store (one trace per turn: LLM calls, tool runs, time spent in sandboxd / mcp-broker — names,
  # durations and token counts only, never prompts or tool arguments). pi's compose pins the image by its
  # Docker Hub name and gives no variable for it, so on a closed network point this at the corporate
  # registry's copy. The default here must equal the image pi's compose pins (a test keeps them equal).
  # Tracing stays ON by default: pi's compose sets JAEGER_HOST=jaeger on gateway, sandboxd and mcp-broker,
  # and nothing here unsets it.
  jaeger:
    image: ${NOAH_PI_JAEGER_IMAGE:-jaegertracing/jaeger:2.23.0}

networks:
  # broker ↔ Noah only. Internal: no route out, and no sandbox is ever attached (sandboxes have no network).
  # The default subnet sits in 172.16.0.0/16, OUTSIDE Docker's default auto-allocation pools
  # (172.17-31.0.0/16, 192.168.0.0/16): a pinned subnet inside them can collide with any network Docker
  # auto-allocates there, this stack's own networks included.
  noah-mcp:
    internal: true
    ipam:
      config:
        - subnet: ${NOAH_MCP_SUBNET:-172.16.248.0/24}
