<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Noah Almighty: register the pptx skill's vendored OFL fonts for LibreOffice, which renders
     the server's APPROXIMATE document previews (share_file). LibreOffice 7.4 ignores fonts embedded
     in a .pptx, so without this a converter deck edited after conversion previews in
     NanumGothic/DejaVu instead of its designed fonts.
     * NotoSansKR-VF (the Hanja helper face of the converter's HTML measurements) is rejected:
       LibreOffice draws a variable font's default instance, which is Thin.
     * 맑은 고딕 / Malgun Gothic cannot be installed on Linux; resolve them to Selawik (Latin,
       Segoe UI metrics) and then Gothic A1 (Hangul), the converter's metric-matched stand-ins.
       Accepted side effect: LibreOffice previews of OTHER documents naming 맑은 고딕 use them too.
     The Dockerfile copies this file to /etc/fonts/conf.d and runs fc-cache BEFORE the converter's
     build-time self-test, so any effect on the Chromium renders would surface as golden drift.
     Mechanics: docs/architecture/pptx-converter.md. -->
<fontconfig>
  <dir>/app/default-skills/skills/pptx/converter/fonts</dir>
  <selectfont><rejectfont><glob>/app/default-skills/skills/pptx/converter/fonts/NotoSansKR-VF.ttf</glob></rejectfont></selectfont>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>Selawik</family><family>Gothic A1</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Selawik</family><family>Gothic A1</family></prefer></alias>
</fontconfig>
